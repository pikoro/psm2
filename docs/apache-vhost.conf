<VirtualHost *:80>
    ServerName psm2.local
    ServerAlias www.psm2.local
    DocumentRoot /var/www/PSM2/public

    # Enable .htaccess overrides — CRITICAL for routing to work
    <Directory /var/www/PSM2/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Prevent access to sensitive directories
    <Directory /var/www/PSM2/vendor>
        Require all denied
    </Directory>
    <Directory /var/www/PSM2/src>
        Require all denied
    </Directory>
    <Directory /var/www/PSM2/config>
        Require all denied
    </Directory>
    <Directory /var/www/PSM2/migrations>
        Require all denied
    </Directory>

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/psm2_error.log
    CustomLog ${APACHE_LOG_DIR}/psm2_access.log combined

    # Redirect to HTTPS in production:
    # RewriteEngine On
    # RewriteCond %{HTTPS} off
    # RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>
